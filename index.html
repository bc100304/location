<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS 位置回報系統</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --success-bg: #def7ec;
      --success-text: #03543f;
      --error-bg: #fde8e8;
      --error-text: #9b1c1c;
      --info-bg: #e1effe;
      --info-text: #1e429f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-group label .required {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease-in-out;
      background-color: #fafafa;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* 載入動畫 */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 狀態訊息顯示區塊 */
    .status-message {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.5;
      display: none;
      word-break: break-all;
    }

    .status-message.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      display: block;
    }

    .status-message.error {
      background-color: var(--error-bg);
      color: var(--error-text);
      display: block;
    }

    .status-message.info {
      background-color: var(--info-bg);
      color: var(--info-text);
      display: block;
    }

    /* 裝置 ID 顯示備註 */
    .device-info {
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      word-break: break-all;
    }

    /* RWD 響應式微調 */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>GPS 位置回報系統</h1>
      <p>請確認資訊並送出您的目前定位</p>
    </div>

    <form id="reportForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="teamCode">團隊編號 <span class="required">*</span></label>
        <input 
          type="text" 
          id="teamCode" 
          class="form-control" 
          placeholder="請輸入團隊編號" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="userName">姓名暱稱</label>
        <input 
          type="text" 
          id="userName" 
          class="form-control" 
          placeholder="請輸入姓名或暱稱（選填）" 
          autocomplete="off"
        />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">取得位置並送出</span>
      </button>
    </form>

    <div id="statusBox" class="status-message"></div>

    <div class="device-info">
      裝置識別碼 (UUID): <br><span id="deviceUuidDisplay">載入中...</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 請在此處填入您的 Google Apps Script 部署 URL
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    // 1. 裝置識別（UUID）邏輯
    function getOrCreateUUID() {
      const STORAGE_KEY = 'device_uuid';
      let uuid = localStorage.getItem(STORAGE_KEY);

      if (!uuid) {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
          uuid = crypto.randomUUID();
        } else {
          // Fallback 用於極少數不支援 randomUUID 的舊版環境
          uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }
        localStorage.setItem(STORAGE_KEY, uuid);
      }
      return uuid;
    }

    const deviceUuid = getOrCreateUUID();
    document.getElementById('deviceUuidDisplay').textContent = deviceUuid;

    // 2. 時間格式化（台北時區 YYYY/MM/DD HH:MM）
    function getTaipeiFormattedTime() {
      const now = new Date();
      
      // 使用 Intl.DateTimeFormat 強制轉換為 Asia/Taipei 時區
      const formatter = new Intl.DateTimeFormat('zh-TW', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const parts = formatter.formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });

      return `${map.year}/${map.month}/${map.day} ${map.hour}:${map.minute}`;
    }

    // 3. UI 狀態變更控制
    function setUIState(loading, message = '', type = '') {
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const statusBox = document.getElementById('statusBox');

      if (loading) {
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = message || '處理中...';
        statusBox.className = 'status-message';
        statusBox.textContent = '';
      } else {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = '取得位置並送出';

        if (message) {
          statusBox.className = `status-message ${type}`;
          statusBox.textContent = message;
        }
      }
    }

    // 4. 取得 Geolocation 承諾包裝 (Promise)
    function getCurrentPositionPromise() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("您的瀏覽器不支援地理位置功能。"));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position),
          (error) => {
            let errorMsg = "無法存取地理位置。";
            switch (error.code) {
              case error.PERMISSION_DENIED:
                errorMsg = "位置權限遭拒絕，請在瀏覽器設定中開啟定位權限。";
                break;
              case error.POSITION_UNAVAILABLE:
                errorMsg = "無法取得當前位置資訊（請確認 GPS 或網路連線）。";
                break;
              case error.TIMEOUT:
                errorMsg = "取得位置逾時，請重試。";
                break;
            }
            reject(new Error(errorMsg));
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      });
    }

    // 5. 主要送出表單邏輯
    async function handleSubmit(event) {
      event.preventDefault();

      const teamCodeInput = document.getElementById('teamCode').value.trim();
      const userNameInput = document.getElementById('userName').value.trim();

      // 表單驗證
      if (!teamCodeInput) {
        setUIState(false, '請輸入團隊編號！', 'error');
        return;
      }

      try {
        // Step 1: 取得定位
        setUIState(true, '定位中...');
        const position = await getCurrentPositionPromise();
        
        const latitude = Number(position.coords.latitude.toFixed(6));
        const longitude = Number(position.coords.longitude.toFixed(6));
        const timestamp = getTaipeiFormattedTime();

        // Step 2: 傳送 API
        setUIState(true, '送出資料中...');

        const payload = {
          teamCode: teamCodeInput,
          uuid: deviceUuid,
          name: userNameInput,
          latitude: latitude,
          longitude: longitude,
          timestamp: timestamp
        };

        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // 避開 GAS CORS 阻擋
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        // 由於 no-cors 模式的回傳 response.type 為 "opaque"，無法讀取 response.json()，
        // 只要沒有 throw Error 即視為請求已成功發送至 Google 伺服器。
        setUIState(false, `✅ 位置已成功送出！\n時區：Asia/Taipei (${timestamp})\n經度：${longitude}, 緯度：${latitude}`, 'success');

      } catch (err) {
        console.error(err);
        setUIState(false, `❌ 失敗：${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
